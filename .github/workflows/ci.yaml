name: phase-1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Ephemeral CI credentials only. No repository/provider secrets needed.
      POSTGRES_PASSWORD: ci-admin-ephemeral
      APP_DB_PASSWORD: ci-app-ephemeral
      DATABASE_URL: postgresql+asyncpg://opspilot_app:ci-app-ephemeral@localhost:5432/opspilot
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:ci-admin-ephemeral@localhost:5432/opspilot
      TEST_DATABASE_URL: postgresql+asyncpg://opspilot_app:ci-app-ephemeral@localhost:5432/opspilot
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:ci-admin-ephemeral@localhost:5432/opspilot
      TENANT_TOKENS: '{"ci-token-with-at-least-32-characters-long":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa","ci-other-token-with-at-least-32-characters":"bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb","ci-approver-token-with-at-least-32-characters":{"tenant":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa","subject":"ci-approver","roles":["approver"]}}'
      AGENT_POLICY: '{"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa":{"projects":{"payments-ops":{"gitlab_project_id":101,"labels":["ops","incident"],"assignees":{"approver":7}}}}}'
      PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.3"
          python-version: "3.12.10"
      - name: Require resolved lockfile
        run: |
          uv lock --check
          uv sync --locked
      - name: Start real PostgreSQL and apply schema
        run: |
          docker compose up --detach --wait db
          uv run --locked python -m opspilot.persistence.migrate
      - name: Quality gates
        run: ./scripts/verify.sh
      - name: Measure retrieval against real PostgreSQL
        run: uv run --locked python -m opspilot.evaluation --seed --output eval-results-ci.json
      - name: RAG regression gate (retrieval-v2 DEV split; held-out is never re-run)
        run: |
          uv run --locked python -m opspilot.benchmark run --split dev --seed --output rag-dev-ci.json
          PYTHONPATH=. uv run --locked python -m scripts.regression_gate rag rag-dev-ci.json
      - name: Agent regression gate (safety invariants + task success)
        run: |
          PYTHONPATH=. uv run --locked python -m scripts.agent_eval --output agent-eval-ci.json
          PYTHONPATH=. uv run --locked python -m scripts.regression_gate agent agent-eval-ci.json
      - name: Security regression suite
        env:
          ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:ci-admin-ephemeral@localhost:5432/opspilot
        run: |
          PYTHONPATH=. uv run --locked python -m scripts.security_suite --output security-ci.json
          PYTHONPATH=. uv run --locked python -m scripts.regression_gate security security-ci.json
      - name: Start built API and smoke test real HTTP
        env:
          DATABASE_URL: postgresql+asyncpg://opspilot_app:ci-app-ephemeral@db:5432/opspilot
          MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:ci-admin-ephemeral@db:5432/opspilot
          OPSPILOT_TOKEN: ci-token-with-at-least-32-characters-long
          OPSPILOT_OTHER_TOKEN: ci-other-token-with-at-least-32-characters
        run: |
          docker compose -f compose.yaml -f compose.smoke.yaml --env-file .env.example up --build --detach --wait --wait-timeout 120
          uv run --locked python scripts/smoke.py --output smoke-results-ci.json
          OPSPILOT_APPROVER_TOKEN=ci-approver-token-with-at-least-32-characters \
            uv run --locked python scripts/agent_smoke.py --output agent-smoke-ci.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: measured-retrieval
          path: |
            eval-results-ci.json
            rag-dev-ci.json
            agent-eval-ci.json
            security-ci.json
            smoke-results-ci.json
            agent-smoke-ci.json
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f compose.yaml -f compose.smoke.yaml down
