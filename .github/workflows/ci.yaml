name: ci
# Release gates. Deliberately NOT run here: the paid OpenAI live smoke, the real GitLab
# smoke (both opt-in scripts that need credentials) and the consumed retrieval-v2 held-out.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Ephemeral CI credentials only. No repository/provider secrets needed.
      POSTGRES_PASSWORD: ci-admin-ephemeral
      APP_DB_PASSWORD: ci-app-ephemeral
      DATABASE_URL: postgresql+asyncpg://opspilot_app:ci-app-ephemeral@localhost:5432/opspilot
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:ci-admin-ephemeral@localhost:5432/opspilot
      TEST_DATABASE_URL: postgresql+asyncpg://opspilot_app:ci-app-ephemeral@localhost:5432/opspilot
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:ci-admin-ephemeral@localhost:5432/opspilot
      TENANT_TOKENS: '{"ci-token-with-at-least-32-characters-long":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa","ci-other-token-with-at-least-32-characters":"bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb","ci-approver-token-with-at-least-32-characters":{"tenant":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa","subject":"ci-approver","roles":["approver"]}}'
      AGENT_POLICY: '{"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa":{"projects":{"payments-ops":{"gitlab_project_id":101,"labels":["ops","incident"],"assignees":{"approver":7}}}}}'
      PROVIDER: fake
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the secret scan covers the full history
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.23"
          python-version: "3.12.15"
      - name: Require resolved lockfile
        run: |
          uv lock --check
          uv sync --locked
      - name: Start real PostgreSQL and apply schema
        run: |
          docker compose up --detach --wait db
          uv run --locked python -m opspilot.persistence.migrate
      - name: Quality gates (lock, format, lint, types, unit, integration, image build)
        run: ./scripts/verify.sh
      - name: Install pinned release scanners (checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C bin gitleaks
          curl -sSfLO https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy_0.75.0_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf trivy_0.75.0_Linux-64bit.tar.gz -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scan (working tree and full git history)
        run: |
          gitleaks dir . --config .gitleaks.toml --redact --no-banner
          gitleaks git . --config .gitleaks.toml --redact --no-banner
      - name: Python dependency audit (whole lock, dev included)
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.9.0 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes --strict --format json --output dependency-audit-ci.json
      - name: Image vulnerability scan (fail on fixable HIGH/CRITICAL) and SBOM
        run: |
          trivy image --scanners vuln --format json --output image-vulnerabilities-ci.json opspilot-ai:release
          trivy image --format cyclonedx --output sbom-image-ci.cdx.json opspilot-ai:release
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 opspilot-ai:release
      - name: Measure retrieval against real PostgreSQL
        run: uv run --locked python -m opspilot.evaluation --seed --output eval-results-ci.json
      - name: RAG regression gate (retrieval-v2 DEV split; held-out is never re-run)
        run: |
          uv run --locked python -m opspilot.benchmark run --split dev --seed --output rag-dev-ci.json
          PYTHONPATH=. uv run --locked python -m scripts.regression_gate rag rag-dev-ci.json
      - name: Agent regression gate (safety invariants + task success)
        run: |
          PYTHONPATH=. uv run --locked python -m scripts.agent_eval --output agent-eval-ci.json
          PYTHONPATH=. uv run --locked python -m scripts.regression_gate agent agent-eval-ci.json
      - name: Security regression suite
        env:
          ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:ci-admin-ephemeral@localhost:5432/opspilot
        run: |
          PYTHONPATH=. uv run --locked python -m scripts.security_suite --output security-ci.json
          PYTHONPATH=. uv run --locked python -m scripts.regression_gate security security-ci.json
      - name: Start built API and smoke test real HTTP
        env:
          DATABASE_URL: postgresql+asyncpg://opspilot_app:ci-app-ephemeral@db:5432/opspilot
          MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:ci-admin-ephemeral@db:5432/opspilot
          OPSPILOT_TOKEN: ci-token-with-at-least-32-characters-long
          OPSPILOT_OTHER_TOKEN: ci-other-token-with-at-least-32-characters
        run: |
          docker compose -f compose.yaml -f compose.smoke.yaml --env-file .env.example up --build --detach --wait --wait-timeout 120
          uv run --locked python scripts/smoke.py --output smoke-results-ci.json
          OPSPILOT_APPROVER_TOKEN=ci-approver-token-with-at-least-32-characters \
            uv run --locked python scripts/agent_smoke.py --output agent-smoke-ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: measured-retrieval
          path: |
            eval-results-ci.json
            rag-dev-ci.json
            agent-eval-ci.json
            security-ci.json
            smoke-results-ci.json
            agent-smoke-ci.json
            sbom-image-ci.cdx.json
            dependency-audit-ci.json
            image-vulnerabilities-ci.json
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f compose.yaml -f compose.smoke.yaml down
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Format, init (no backend) and validate; never plan with real credentials or apply
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
