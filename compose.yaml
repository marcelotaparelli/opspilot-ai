services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: opspilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "on-failure:3"
  migrate:
    build: .
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
    command: ["python", "-m", "opspilot.persistence.migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      TENANT_TOKENS: ${TENANT_TOKENS:?Set TENANT_TOKENS}
      PROVIDER: ${PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      ANSWER_MODEL: ${ANSWER_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 3
    stop_grace_period: 20s
    restart: "on-failure:3"
    read_only: true
    tmpfs:
      - /tmp
volumes:
  postgres_data:
