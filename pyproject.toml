[project]
name = "opspilot-ai"
version = "0.1.0"
description = "Tenant-isolated operational knowledge RAG vertical slice"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "sqlalchemy[asyncio]==2.0.41",
  "asyncpg==0.30.0",
  "openai==1.78.1",
  "uvicorn==0.34.2",
  "langgraph==1.2.12",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.9",
  "mypy==1.15.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a real PostgreSQL database with pgvector"]
